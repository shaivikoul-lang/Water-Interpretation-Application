name: Deploy Progressive Disclosure UI

# Separate track — does NOT merge to main.
# Publishes feature/progressive-disclosure-ui to branch gh-pages-progressive-disclosure.

on:
  push:
    branches:
      - feature/progressive-disclosure-ui
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-progressive-disclosure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pws/CO0118015_hrw/dashboard/package-lock.json

      - name: Build static site
        run: bash scripts/build-github-pages-site.sh

      - name: Deploy to gh-pages-progressive-disclosure branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages-progressive-disclosure
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy WaterLens progressive disclosure UI'
